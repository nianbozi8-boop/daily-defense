    <script>
      (function() {
        if (typeof window !== 'undefined') {
          // 1. Intercept Vite HMR WebSocket to satisfy Vite client without network error
          var OrigWS = window.WebSocket;
          if (OrigWS) {
            window.WebSocket = function(url, protocols) {
              var isViteHmr = false;
              if (typeof protocols === 'string' && (protocols === 'vite-hmr' || protocols === 'vite-ping')) {
                isViteHmr = true;
              } else if (Array.isArray(protocols) && (protocols.includes('vite-hmr') || protocols.includes('vite-ping'))) {
                isViteHmr = true;
              } else if (typeof url === 'string' && (url.includes('token=') || url.includes('vite') || url.includes('/@vite'))) {
                isViteHmr = true;
              }

              if (isViteHmr) {
                var listeners = {};
                var fakeWs = {
                  readyState: 1, // WebSocket.OPEN
                  bufferedAmount: 0,
                  extensions: '',
                  protocol: typeof protocols === 'string' ? protocols : 'vite-hmr',
                  url: String(url || ''),
                  binaryType: 'blob',
                  onopen: null,
                  onclose: null,
                  onerror: null,
                  onmessage: null,
                  addEventListener: function(event, handler) {
                    if (!listeners[event]) listeners[event] = [];
                    listeners[event].push(handler);
                    // Satisfy Vite client connect() immediately on next microtask
                    if (event === 'open') {
                      setTimeout(function() {
                        fakeWs.readyState = 1;
                        try {
                          if (typeof fakeWs.onopen === 'function') fakeWs.onopen({ type: 'open' });
                        } catch (e) {}
                        try {
                          handler({ type: 'open' });
                        } catch (e) {}
                      }, 0);
                    }
                  },
                  removeEventListener: function(event, handler) {
                    if (listeners[event]) {
                      listeners[event] = listeners[event].filter(function(h) { return h !== handler; });
                    }
                  },
                  dispatchEvent: function() { return true; },
                  send: function() {},
                  close: function() {
                    fakeWs.readyState = 3;
                  }
                };
                return fakeWs;
              }
              return new OrigWS(url, protocols);
            };
            window.WebSocket.prototype = OrigWS.prototype;
            window.WebSocket.CONNECTING = 0;
            window.WebSocket.OPEN = 1;
            window.WebSocket.CLOSING = 2;
            window.WebSocket.CLOSED = 3;
          }

          // 2. Prevent unhandled rejections from halting UI or alerting parent frame
          window.addEventListener('unhandledrejection', function(event) {
            var reason = event.reason;
            var msg = String(reason && (reason.message || reason) || '');
            if (
              msg.includes('WebSocket') ||
              msg.includes('opened') ||
              msg.includes('vite') ||
              msg.includes('closed without opened') ||
              msg.includes('ADMIN_ONLY_OPERATION') ||
              msg.includes('popup-closed-by-user') ||
              msg.includes('cancelled-popup-request')
            ) {
              event.preventDefault();
              event.stopImmediatePropagation();
              return true;
            }
          }, true);

          // 3. Catch unhandled errors
          window.addEventListener('error', function(event) {
            var msg = String(event.message || (event.error && event.error.message) || '');
            if (
              msg.includes('WebSocket') ||
              msg.includes('ws') ||
              msg.includes('opened') ||
              msg.includes('vite') ||
              msg.includes('closed without opened') ||
              msg.includes('ADMIN_ONLY_OPERATION') ||
              msg.includes('popup-closed-by-user') ||
              msg.includes('cancelled-popup-request')
            ) {
              event.preventDefault();
              event.stopImmediatePropagation();
              return true;
            }
          }, true);

          // 4. Suppress console warnings/errors from Vite HMR connection attempts
          var origError = console.error;
          console.error = function() {
            var msg = Array.prototype.slice.call(arguments).map(function(a) {
              return String(a && a.message ? a.message : a);
            }).join(' ');
            if (
              msg.includes('WebSocket') ||
              msg.includes('vite') ||
              msg.includes('server connection lost') ||
              msg.includes('failed to connect to websocket') ||
              msg.includes('ADMIN_ONLY_OPERATION') ||
              msg.includes('popup-closed-by-user') ||
              msg.includes('cancelled-popup-request')
            ) {
              return;
            }
            origError.apply(console, arguments);
          };

          var origWarn = console.warn;
          console.warn = function() {
            var msg = Array.prototype.slice.call(arguments).map(function(a) {
              return String(a && a.message ? a.message : a);
            }).join(' ');
            if (
              msg.includes('WebSocket') ||
              msg.includes('vite') ||
              msg.includes('vite-hmr') ||
              msg.includes('server connection lost') ||
              msg.includes('connecting...') ||
              msg.includes('Third-party cookie') ||
              msg.includes('SameSite')
            ) {
              return;
            }
            origWarn.apply(console, arguments);
          };
        }
      })();
    </script>
